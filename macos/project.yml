name: dotsync
options:
  bundleIdPrefix: com.changja88
  # Every text is Korean. Without this the app and the widget run in English,
  # and system-formatted times ("3 hours, 44 minutes") follow it.
  developmentLanguage: ko
  deploymentTarget:
    macOS: "27.0"
packages:
  DotsyncKit:
    path: DotsyncKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: GR53VV7ZD2
targets:
  dotsync:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - package: DotsyncKit
      - target: dotsyncWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: dotsync
        PRODUCT_BUNDLE_IDENTIFIER: com.changja88.dotsync
        # App/AppIcon.icon, made in Icon Composer's format: Xcode builds the
        # dark, clear and tinted looks from it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: dotsync
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleURLTypes:
          - CFBundleURLName: com.changja88.dotsync
            CFBundleURLSchemes: [dotsync]
  dotsyncWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    dependencies:
      - package: DotsyncKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.changja88.dotsync.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: dotsync
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
