<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DotSync</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <section class="popover" data-surface="popover" hidden aria-label="DotSync menu">
      <header class="popover-header">
        <span class="brand-mark" aria-hidden="true">D</span>
        <div class="brand-copy">
          <h1>DotSync</h1>
          <p id="popover-updated">아직 조회하지 않음 · 로컬 전용</p>
        </div>
        <button
          class="icon-button"
          type="button"
          data-native-action="open_manager"
          data-destination="settings"
          aria-label="Settings 열기"
        >⚙</button>
      </header>
      <div class="summary-strip" aria-label="요약">
        <div>
          <strong id="summary-usage">—</strong>
          <span>가장 높은 Codex 사용량</span>
        </div>
        <div>
          <strong id="summary-sync">—</strong>
          <span>동기화 확인 필요</span>
        </div>
      </div>
      <progress max="100" id="global-progress" value="0" hidden aria-label="작업 진행률"></progress>
      <main id="popover-content" aria-live="polite"></main>
      <div class="popover-actions" aria-label="동기화 미리보기">
        <button type="button" class="primary" data-preview-direction="backup">↑ Backup preview</button>
        <button type="button" data-preview-direction="apply">↓ Apply preview</button>
      </div>
      <footer class="popover-footer">
        <button
          type="button"
          data-native-action="open_manager"
          data-destination="overview"
        >관리 창 열기 ↗</button>
        <button
          class="icon-button quit-button"
          type="button"
          data-native-action="quit_app"
          aria-label="DotSync 종료"
        >⌁</button>
      </footer>
    </section>

    <section class="manager" data-surface="manager" hidden aria-label="DotSync management">
      <div class="manager-shell">
        <aside class="manager-sidebar">
          <header class="sidebar-header">
            <div>
              <h1>DotSync</h1>
              <p>로컬 계정과 설정 관리</p>
            </div>
            <button class="icon-button" type="button" data-action="refresh-all" aria-label="새로고침">↻</button>
          </header>
          <nav aria-label="주요 화면">
            <div class="nav-smart-grid">
              <button type="button" data-destination="overview">
                <span class="nav-icon overview-icon" aria-hidden="true">⌂</span>
                <strong>Overview</strong>
              </button>
              <button type="button" data-destination="accounts">
                <span class="nav-icon accounts-icon" aria-hidden="true">◎</span>
                <strong>Accounts</strong>
              </button>
            </div>
            <span class="nav-label">DotSync</span>
            <button class="nav-list-item" type="button" data-destination="sync">
              <span class="nav-icon sync-icon" aria-hidden="true">⇄</span>
              <strong>Config Sync</strong>
            </button>
            <button class="nav-list-item" type="button" data-destination="settings">
              <span class="nav-icon settings-icon" aria-hidden="true">⚙</span>
              <strong>Settings</strong>
            </button>
          </nav>
          <p class="privacy-note">
            <strong>원본 보호 활성</strong>
            계정 기능은 ~/.claude와 ~/.codex를 읽거나 수정하지 않습니다.
          </p>
        </aside>
        <main id="manager-content" tabindex="-1" aria-live="polite"></main>
      </div>
    </section>

    <dialog id="confirmation-dialog" aria-labelledby="confirmation-title" aria-describedby="confirmation-copy">
      <div class="dialog-body">
        <h2 id="confirmation-title">확인</h2>
        <p id="confirmation-copy"></p>
        <label id="confirmation-label" for="confirmation-input" hidden>이름</label>
        <input id="confirmation-input" maxlength="120" hidden>
      </div>
      <form method="dialog">
        <button type="submit" value="cancel" autofocus>취소</button>
        <button type="submit" id="confirmation-submit" value="confirm">계속</button>
      </form>
    </dialog>

    <p id="status-message" class="status-message" role="status" aria-live="polite" hidden></p>
  </body>
</html>
